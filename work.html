        <div class="filters" role="group" aria-label="Filter by discipline" data-bind="filters"></div>
        <div class="views" role="group" aria-label="View">
          <button aria-pressed="true" data-v="list">List</button><button aria-pressed="false" data-v="grid">Grid</button>
        </div>
      </div>
      <ol class="rows" data-bind="rows"></ol>

    </div>
  </section>
</main>
<script src="./vendor/lenis/lenis.min.js"></script>
<script src="./assets/site.js"></script>
<script>
Site.ready(C => {
  const { $, $$, esc, bind, card, row, projects, disciplinesOf, DISCIPLINES, observe, peek } = Site;
  const ps = projects();
  const present = DISCIPLINES.map(([n]) => [n, ps.filter(p => disciplinesOf(p).includes(n)).length]).filter(([, k]) => k);
  bind('lede', esc(`${ps.length} projects, each taken from an idea to a working prototype. Filter by discipline, or open a project for the full case study.`));
  bind('filters', `<button aria-pressed="true" data-f="">All<sup>${ps.length}</sup></button>` +
    present.map(([n, k]) => `<button aria-pressed="false" data-f="${esc(n)}">${esc(n)}<sup>${k}</sup></button>`).join(''));
  bind('rows', ps.map((x, k) => row(x, k + 1)).join(''));
  bind('grid', ps.map((x, k) => card(x, { n: k + 1 })).join(''));
  const rows = $('[data-bind="rows"]'), grid = $('[data-bind="grid"]');
  const setView = v => {
    $$('.views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
    rows.hidden = v === 'grid'; grid.hidden = v !== 'grid';
    const u = new URL(location.href); v === 'grid' ? u.searchParams.set('view', 'grid') : u.searchParams.delete('view'); history.replaceState(null, '', u);
    observe();
  };
  $('.views').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); });
  if (new URLSearchParams(location.search).get('view') === 'grid') setView('grid');
  const fb = $('[data-bind="filters"]');
  const apply = f => {
    $$('button', fb).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.f === f)));
    $$('.pcard, .row').forEach(c => c.classList.toggle('is-out', !!f && !c.dataset.d.split('|').includes(f)));
    // renumber the visible rows
    let n = 0; $$('.row', rows).forEach(r => { if (!r.classList.contains('is-out')) r.querySelector('.row__n').textContent = String(++n).padStart(2, '0'); });
    const u = new URL(location.href); f ? u.searchParams.set('d', f) : u.searchParams.delete('d'); history.replaceState(null, '', u);
  };
  fb.addEventListener('click', e => { const b = e.target.closest('button'); if (b) apply(b.dataset.f); });
  const start = new URLSearchParams(location.search).get('d');
  if (start && present.some(([n]) => n === start)) apply(start);
  observe(); peek();
});
</script>
