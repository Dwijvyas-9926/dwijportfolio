<body data-page="resume">
<main id="main">
  <article class="cv wrap">
    <header class="cv__head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="./">Home</a><span aria-hidden="true">/</span><span aria-current="page">Résumé</span></nav>

      <div class="cv__actions">
        <a class="btn btn--primary" data-resume href="./Dwij_Vyas_Resume.pdf" download>Download PDF</a>

      </div>
    </header>
    <section class="cv__sec" aria-labelledby="cv-edu"><h2 id="cv-edu">Education</h2><div class="cv__rows" data-bind="education"></div></section>
    <section class="cv__sec" aria-labelledby="cv-exp"><h2 id="cv-exp">Experience</h2><div class="cv__rows" data-bind="experience"></div></section>
    <section class="cv__sec" aria-labelledby="cv-rec"><h2 id="cv-rec">Recognition</h2><div class="cv__rows" data-bind="recognition"></div></section>
    <section class="cv__sec" aria-labelledby="cv-pr"><h2 id="cv-pr">Projects</h2><div class="cv__rows" data-bind="projects"></div></section>
    <section class="cv__sec" aria-labelledby="cv-sk"><h2 id="cv-sk">Skills</h2><div class="cv__rows" data-bind="skills"></div></section>
  </article>
</main>
<script src="./vendor/lenis/lenis.min.js"></script>
<script src="./assets/site.js"></script>
<script>
Site.ready(C => {
  const { esc, bind, projects, splitKind, resultFor, yearFor, observe, projectUrl } = Site;
  const p = C.profile || {};
  bind('name', `<span class="line"><span>${esc(String(p.name || '').trim())}</span></span>`);
  bind('role', esc([p.discipline, p.institution, p.location].filter(Boolean).join(' — ')));
  bind('contact', (C.contact || []).map(c => `<a href="${esc(c.href)}">${esc(/^https?:/i.test(c.href) ? c.href.replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '') : c.label)}</a>`).join(''));
  bind('about', esc([p.about1, p.availability ? p.availability + '.' : ''].filter(Boolean).join(' ')));
  const rowHtml = (k, t, s, n) => `<div class="cv__row"><span class="mono">${esc(k)}</span><div><h3>${esc(t)}</h3>${s ? `<p class="cv__s">${esc(s)}</p>` : ''}${n ? `<p>${esc(n)}</p>` : ''}</div></div>`;
  bind('education', (C.education || []).map(e => rowHtml(e.years, e.school, e.detail)).join(''));
  const ms = (C.milestones || []).slice().sort((a, b) => String(b.when).localeCompare(String(a.when)));
  bind('experience', ms.filter(m => /experience/i.test(m.kind || '')).map(m => rowHtml(m.when, m.title, m.emphasis, m.note)).join(''));
  bind('recognition', ms.filter(m => /recognition/i.test(m.kind || '')).map(m => rowHtml(m.when, m.title, m.emphasis, m.note)).join(''));
  bind('projects', projects().map(x => `<div class="cv__row"><span class="mono">${esc(yearFor(x) || '')}</span><div><h3><a href="${projectUrl(x.id)}">${esc(x.title)}</a> <small>${esc(x.sub)}</small></h3><p>${esc(x.desc)}</p>${(x.tech || []).length ? `<p class="cv__tech mono">${x.tech.map(esc).join(', ')}</p>` : ''}${resultFor(x) ? `<p class="cv__s">${esc(resultFor(x))}</p>` : ''}</div></div>`).join(''));
  bind('skills', (C.domains || []).filter(d => d.id !== 'all').map(d => `<div class="cv__row"><span class="mono">${esc(d.label)}</span><div><p>${d.skills.map(esc).join(', ')}</p></div></div>`).join(''));
  document.title = `Résumé — ${String(p.name || '').trim()}`;
  observe();
});
</script>
