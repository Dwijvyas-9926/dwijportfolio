<script>
// Old single-page links (#project/avion) now have their own pages.
(function () {
  const m = /^#project\/(.+)$/.exec(location.hash);
  if (m) location.replace('./project.html?p=' + m[1]);
})();
Site.ready(C => {
  const { $, $$, esc, rich, bind, card, projects, reduced, fine } = Site;
  const p = C.profile || {};
  const name = String(p.name || '').trim();
  let i = 0;
  bind('name', name.split(/\s+/).map(w => `<span class="ln">${[...w].map(ch => `<span class="ch" style="--i:${i++}">${esc(ch)}</span>`).join('')}</span>`).join(''));
  bind('discipline', esc(p.discipline || ''));
  bind('institution', esc(p.institution || ''));
  bind('location', esc(String(p.location || '').split(',').filter((s, k, a) => k === 0 || k === a.length - 1).join(',')));
  bind('tagline', rich(p.tagline));
  bind('about1', esc(p.about1).split(/\s+/).map(w => `<span class="w">${w}</span>`).join(' '));
  // currently: derived from education and the latest entries
  const ms = (C.milestones || []).slice().sort((a, b) => String(b.when).localeCompare(String(a.when)));
  const ed = (C.education || [])[0];
  const exp = ms.find(m => /experience/i.test(m.kind || ''));
  const rec = ms.find(m => /recognition/i.test(m.kind || '') && m.emphasis);
  const nowRows = [
    ed && ['Studying', `${ed.school.split(' ').map(w => w[0]).join('')}, ${(ed.detail || '').split('·')[0].trim()}`],
    exp && ['Latest experience', exp.title],
    rec && ['Latest result', `${rec.emphasis}, ${rec.title}`],
    p.availability && ['Looking for', p.availability.replace(/^Open to\s*/i, '').replace(/^./, c => c.toUpperCase())],
  ].filter(Boolean);
  bind('now', nowRows.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join(''));

  // marquee: schools from education, organisations from experience & recognition
  const orgs = [];
  (C.education || []).forEach(e => e.school && orgs.push(e.school));
  (C.milestones || []).forEach(m => {
    let t = String(m.title || '');
    t = t.includes('—') ? t.split('—').pop() : t;
    t = t.replace(/\b(hackathon|\d+(\.\d+)?)\b/gi, '').replace(/\s{2,}/g, ' ').trim();
    if (t && !orgs.some(o => o.toLowerCase() === t.toLowerCase())) orgs.push(t);
  });
  const run = orgs.map(o => `<span>${esc(o)}</span>`).join('');
  bind('marquee', run + run.replace(/<span>/g, '<span aria-hidden="true">'));

  // numbers, all derived from content
  const edu = (C.education || [])[0];
  const cpi = edu && /CPI\s*([\d.]+)\s*\/\s*(\d+)/i.exec(edu.detail || '');
  const finals = (C.milestones || []).filter(m => /finalist/i.test(m.emphasis || '')).length;
  const all = (C.domains || []).find(d => d.id === 'all');
  const ps = projects();
  const stats = [
    cpi && [cpi[1], `CPI out of ${cpi[2]}, ${edu.school}`, 2],
    [ps.length, 'Systems built, from discrete logic to flight', 0],
    finals && [finals, `State robotics ${finals === 1 ? 'final' : 'finals'} reached`, 0],
    all && [all.skills.length, 'Tools, languages and disciplines', 0],
  ].filter(Boolean);
  bind('stats', stats.map(([v, l, d]) => `<div class="stat"><b data-count="${esc(v)}" data-dec="${d}">${esc(v)}</b><span>${esc(l)}</span></div>`).join(''));

  // three selected projects: one wide, two beside each other
  bind('workMeta', `Three of ${ps.length} projects`);
  bind('featured', ps.slice(0, 3).map((x, k) => card(x, { wide: k === 0 })).join(''));
  bind('allBtn', `View all ${ps.length} projects`);

  // statement words fill in as you read; the hero has depth on scroll
  const stage = $('#top'), heroName = $('#name'), heroImg = $('#heroPortrait'), heroFoot = $('#heroFoot'), st = $('#statement');
  const words = $$('.w', st);
  const hp = { x: 0, tx: 0 };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  function onScroll() {
    const y = scrollY;
    if (!reduced && y < innerHeight * 1.3) {
      heroName.style.transform = `translate3d(${(-hp.x * 16).toFixed(1)}px, ${(y * 0.42).toFixed(1)}px, 0)`;
      heroImg.style.transform = `translate3d(${(hp.x * 10).toFixed(1)}px, ${(y * 0.14).toFixed(1)}px, 0) scale(${(1 - Math.min(y / innerHeight, 1) * 0.04).toFixed(4)})`;
      heroFoot.style.opacity = (1 - clamp(y / (innerHeight * 0.3))).toFixed(3);
    }
    const r = st.getBoundingClientRect();
    const q = clamp((innerHeight * 0.85 - r.top) / (r.height + innerHeight * 0.35));
    const n = Math.round(q * words.length);
    words.forEach((w, k) => w.classList.toggle('on', k < n));
  }
  addEventListener('scroll', onScroll, { passive: true });
  if (fine && !reduced) {
    stage.addEventListener('pointermove', e => { hp.tx = (e.clientX / innerWidth) * 2 - 1; });
    stage.addEventListener('pointerleave', () => { hp.tx = 0; });
    const drift = () => { const d = hp.tx - hp.x; if (Math.abs(d) > 0.001) { hp.x += d * 0.08; onScroll(); } requestAnimationFrame(drift); };
    requestAnimationFrame(drift);
  }
  onScroll();
  requestAnimationFrame(() => requestAnimationFrame(() => { stage.classList.remove('pre'); stage.classList.add('go'); }));
});
</script>
