</head>
<body data-page="project">
<main id="main">
  <article id="case">
    <header class="phead phead--case" id="caseHead">
      <div class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="./">Home</a><span aria-hidden="true">/</span><a href="./work.html">Work</a><span aria-hidden="true">/</span><span aria-current="page" data-bind="crumb"></span></nav>
        <p class="case__n mono" data-bind="num"></p>
        <div class="case__head">
          <div>
            <h1 class="rv" data-bind="title"></h1>
            <p class="case__sub" data-bind="sub"></p>
          </div>
          <div class="case__tags" data-bind="tags"></div>
        </div>
        <div data-bind="cover"></div>
      </div>
    </header>
    <div class="wrap">
      <div class="case__body">
        <section aria-labelledby="ov-h">
          <h2 id="ov-h">Overview</h2>
          <p class="case__desc" data-bind="desc"></p>
        </section>
        <aside aria-label="Project details"><dl class="spec" data-bind="spec"></dl></aside>
      </div>
      <section class="chapters" data-bind="chapters" aria-label="Case study"></section>
      <section class="case__gallery" data-bind="gallery" aria-labelledby="gal-h"></section>
    </div>
    <nav class="next" data-bind="pager" aria-label="More projects"></nav>
    <div class="wrap">
    </div>
  </article>
</main>
<script src="./vendor/lenis/lenis.min.js"></script>
<script src="./assets/site.js"></script>
<script>
Site.ready(C => {
  const { $, esc, bind, splitKind, linkLabel, ext, projectUrl, projects, resultFor, yearFor, lbOpen, observe, ARROW } = Site;
  const ps = projects();
  const id = new URLSearchParams(location.search).get('p') || (/^#project\/(.+)$/.exec(location.hash) || [])[1];
  const i = ps.findIndex(x => x.id === id);
  if (i < 0) {
    $('#case').innerHTML = `<div class="wrap notfound phead"><h1>Project not found</h1><p class="phead__lede">That link doesn’t match a project. <a class="link" href="./work.html">See all work</a></p></div>`;
    return;
  }
  const x = ps[i], imgs = x.images || [];
  document.title = `${x.title} — Dwij Vyas`;
  const desc = `${x.title}: ${x.sub}. ${String(x.desc || '').slice(0, 140)}`;
  const setMeta = (sel, attr, v) => { const el = document.querySelector(sel); if (el) el.setAttribute(attr, v); };
  const url = `${location.origin}/project?p=${encodeURIComponent(x.id)}`;
  setMeta('meta[name="description"]', 'content', desc);
  setMeta('link[rel="canonical"]', 'href', url);
  setMeta('meta[property="og:url"]', 'content', url);
  setMeta('meta[property="og:title"]', 'content', `${x.title} — Dwij Vyas`);
  setMeta('meta[property="og:description"]', 'content', desc);
  setMeta('meta[name="twitter:title"]', 'content', `${x.title} — Dwij Vyas`);
  setMeta('meta[name="twitter:description"]', 'content', desc);
  bind('crumb', esc(x.title));
  bind('num', `${String(i + 1).padStart(2, '0')} / ${String(ps.length).padStart(2, '0')}`);
  if (x.accent) $('#caseHead').style.setProperty('--pa', x.accent);
  bind('title', `<span class="line"><span>${esc(x.title)}</span></span>`);
  bind('sub', esc(x.sub));
  const yr = yearFor(x);
  bind('tags', (yr ? `<span class="tag">${esc(yr)}</span>` : '') + splitKind(x.kind).map(k => `<span class="tag">${esc(k)}</span>`).join(''));
  bind('cover', imgs[0] ? `<button class="case__cover" data-i="0" aria-label="Enlarge image: ${esc(imgs[0].caption || x.title)}"><img src="${imgs[0].src}" alt="${esc(imgs[0].caption || x.title)}"></button>` : '');
  bind('desc', esc(x.desc));
  const res = resultFor(x), tech = x.tech || [];
  bind('spec', [
    yr && `<div><dt>Year</dt><dd>${esc(yr)}</dd></div>`,
    x.kind && `<div><dt>Discipline</dt><dd>${esc(splitKind(x.kind).join(', '))}</dd></div>`,
    tech.length && `<div><dt>Built with</dt><dd><ul>${tech.map(t => `<li>${esc(t)}</li>`).join('')}</ul></dd></div>`,
    res && `<div><dt>Result</dt><dd>${esc(res)}</dd></div>`,
    x.link && `<div><dt>Link</dt><dd><a class="btn btn--primary" href="${esc(x.link)}"${ext(x.link)}>${linkLabel(x.link)}</a></dd></div>`,
  ].filter(Boolean).join(''));
  // chapters: an optional sequence in content.json; images they use leave the gallery
  const ch = Array.isArray(x.chapters) ? x.chapters.filter(c => c && c.title) : [];
  const used = new Set();
  const chEl = bind('chapters', ch.map((c, k) => {
    const im = c.image ? imgs[c.image - 1] : null; if (im) used.add(c.image - 1);
    return `<article class="chap fade${im ? '' : ' chap--text'}">
      <div class="chap__text"><p class="mono">${String(k + 1).padStart(2, '0')} / ${String(ch.length).padStart(2, '0')}</p><h2>${esc(c.title)}</h2><p class="chap__p">${esc(c.text)}</p></div>
      ${im ? `<figure class="chap__fig"><button data-i="${c.image - 1}" aria-label="Enlarge image: ${esc(im.caption || x.title)}"><img src="${im.src}" alt="${esc(im.caption || x.title)}" loading="lazy" decoding="async"></button>${im.caption ? `<figcaption>${esc(im.caption)}</figcaption>` : ''}</figure>` : ''}
    </article>`;
  }).join(''));
  if (!ch.length && chEl) chEl.hidden = true;
  const rest = imgs.slice(1).filter((im, k) => !used.has(k + 1));
  const gal = bind('gallery', rest.length ? `<h2 id="gal-h">${ch.length ? 'More photographs' : 'Gallery'}</h2><div class="gal">${rest.map((im, k) => `
    <figure class="fade"><button data-i="${imgs.indexOf(im)}" aria-label="Enlarge image ${imgs.indexOf(im) + 1}"><img src="${im.src}" alt="${esc(im.caption || x.title + ', image ' + (imgs.indexOf(im) + 1))}" loading="lazy" decoding="async"></button>
    ${im.caption ? `<figcaption>${esc(im.caption)}</figcaption>` : ''}</figure>`).join('')}</div>` : '');
  if (!rest.length && gal) gal.hidden = true;
  document.addEventListener('click', e => { const b = e.target.closest('#case [data-i]'); if (b) lbOpen(imgs, +b.dataset.i); });
  if (ps.length > 1) {
    const prev = ps[(i - 1 + ps.length) % ps.length], next = ps[(i + 1) % ps.length];
    const ni = (next.images || [])[0];
    bind('pager', `<div class="wrap next__in">
        <a class="next__prev link" href="${projectUrl(prev.id)}">Previous: ${esc(prev.title)}</a>
        <a class="next__a" href="${projectUrl(next.id)}" data-cursor="View">
          <span class="next__img">${ni ? `<img src="${ni.src}" alt="" loading="lazy" decoding="async">` : ''}</span>
          <span class="next__body"><span class="mono">Next project ${String((i + 1) % ps.length + 1).padStart(2, '0')}</span><span class="next__t">${esc(next.title)}</span><span class="next__s">${esc(next.sub)}</span></span>
        </a>
      </div>`);
  }
  // the cover drifts a little as you scroll
  const cov = $('.case__cover img');
  if (cov && !Site.reduced) { const px = () => { const r = cov.parentElement.getBoundingClientRect(); const t = Math.min(1, Math.max(0, (innerHeight - r.top) / (innerHeight + r.height))); cov.style.transform = `translate3d(0,${(-16 * t).toFixed(1)}%,0)`; }; addEventListener('scroll', px, { passive: true }); px(); }
  observe();
});
</script>
</body>
</html>
