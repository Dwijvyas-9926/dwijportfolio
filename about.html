<script>
Site.ready(C => {
  const { $, esc, bind, linkLabel, ext, observe, reduced } = Site;
  const p = C.profile || {};
  bind('discipline', esc([p.discipline, p.institution].filter(Boolean).join(', ')));
  bind('name', `<span class="line"><span>${esc(String(p.name || '').trim())}</span></span>`);
  bind('about1', esc(p.about1));
  bind('about2', esc(p.about2));
  const av = bind('availability', esc(p.availability)); if (av && !p.availability) av.hidden = true;

  // education: a card each, with the score pulled out
  bind('education', (C.education || []).map(e => {
    const parts = String(e.detail || '').split('·').map(s => s.trim()).filter(Boolean);
    const si = parts.findIndex(s => /CPI|%|GPA|CGPA/i.test(s));
    const score = si > -1 ? parts.splice(si, 1)[0] : '';
    const m = /([\d.]+)\s*(\/\s*\d+|%)?/.exec(score);
    return `<article class="ecard fade"><p class="ecard__yr">${esc(e.years)}</p><h3>${esc(e.school)}</h3><p>${parts.map(esc).join('<br>')}</p>
      ${m ? `<div class="ecard__score"><b>${esc(m[1])}${m[2] === '%' ? '%' : ''}</b><span>${esc(/CPI/i.test(score) ? 'CPI' + (m[2] && m[2] !== '%' ? ' ' + m[2].replace(/\s/g, '') : '') : 'Score')}</span></div>` : ''}</article>`;
  }).join(''));

  // experience & recognition: a trace with solder-pad nodes
  const ms = (C.milestones || []).slice();
  const years = [...new Set(ms.map(m => String(m.when || '').trim()))].sort((a, b) => b.localeCompare(a));
  bind('record', years.map(y => `
    <div class="tl__year fade"><p class="tl__k">${esc(y || '—')}</p><div>
      ${ms.filter(m => String(m.when || '').trim() === y).map(m => `
        <article class="entry">
          <div class="entry__top"><span class="pill pill--${esc(String(m.kind || '').toLowerCase())}">${esc(m.kind)}</span>${m.emphasis ? `<span class="pill pill--em">${esc(m.emphasis)}</span>` : ''}</div>
          <h3>${esc(m.title)}</h3>
          ${m.note ? `<p>${esc(m.note)}</p>` : ''}
          ${m.link ? `<a class="link" href="${esc(m.link)}"${ext(m.link)}>${linkLabel(m.link)}</a>` : ''}
        </article>`).join('')}
    </div></div>`).join(''));
  // the trace fills in as you scroll through it
  const tl = $('#tl');
  const fill = () => { const r = tl.getBoundingClientRect(); const q = Math.min(1, Math.max(0, (innerHeight * 0.7 - r.top) / r.height)); tl.style.setProperty('--fill-h', (reduced ? 100 : q * 100).toFixed(1) + '%'); };
  addEventListener('scroll', fill, { passive: true }); fill();

  // skills: each area gets its own waveform
  const WAVES = { logic: 'square', embedded: 'pulse', software: 'sine', robotics: 'triangle', fab: 'saw' };
  const wave = kind => {
    const pts = [];
    for (let i = 0; i <= 200; i++) {
      const x = i / 200, ph = (x * 4) % 1; let y;
      if (kind === 'square') y = ph < 0.5 ? 0.15 : 0.85;
      else if (kind === 'pulse') y = ph < 0.18 ? 0.12 : 0.88;
      else if (kind === 'triangle') y = ph < 0.5 ? 0.85 - ph * 1.4 : 0.15 + (ph - 0.5) * 1.4;
      else if (kind === 'saw') y = 0.85 - ph * 0.7;
      else y = 0.5 - 0.36 * Math.sin(x * 8 * Math.PI);
      pts.push(`${(x * 300).toFixed(1)},${(y * 36).toFixed(1)}`);
    }
    return `<svg viewBox="0 0 300 36" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="18" x2="300" y2="18"/><path d="M${pts.join(' L')}"/></svg>`;
  };
  const all = (C.domains || []).find(d => d.id === 'all');
  const doms = (C.domains || []).filter(d => d.id !== 'all' && (d.skills || []).length);
  bind('skillsMeta', all ? `${all.skills.length} tools and disciplines across ${doms.length} areas` : '');
  bind('skills', doms.map((d, i) => `<article class="skcard fade${doms.length % 3 === 2 && i === doms.length - 1 ? ' skcard--wide' : ''}">${wave(WAVES[d.id] || 'sine')}
    <h3>${esc(d.label)}<small>${d.skills.length}</small></h3><ul>${d.skills.map(s => `<li>${esc(s)}</li>`).join('')}</ul></article>`).join(''));
  observe();
});
</script>
